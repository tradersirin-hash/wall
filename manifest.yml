# Wall. Every scope and the sql module are in the first production deploy: changing
# scopes later forces a major version that every site must accept. Modules that add
# no scope (the Rovo agent, actions and skill, the acknowledgement panel) are added
# later as minor versions.
app:
  id: ari:cloud:ecosystem::app/REPLACE_WITH_ID_FROM_FORGE_REGISTER
  runtime:
    name: nodejs24.x

modules:
  jira:adminPage:
    - key: wall-admin
      resource: admin-ui
      render: native
      resolver:
        function: resolver
      title: Wall

  scheduledTrigger:
    - key: wall-drift-scan
      function: drift-scan
      interval: hour

  sql:
    - key: main
      engine: mysql

  trigger:
    - key: wall-lifecycle
      function: enqueue-migrations
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  consumer:
    - key: wall-migrations
      queue: wall-migrations
      function: run-migrations

  function:
    - key: resolver
      handler: index.handler
      timeoutSeconds: 25
    - key: drift-scan
      handler: index.driftScan
      timeoutSeconds: 900
    - key: enqueue-migrations
      handler: index.enqueueMigrations
    - key: run-migrations
      handler: index.runMigrations
      timeoutSeconds: 900

resources:
  - key: admin-ui
    path: src/frontend/admin.jsx

permissions:
  scopes:
    # Settings and the ledger anchor (key-value store).
    - storage:app
    # Projects, permission schemes and grants, project roles, permission checks.
    - read:jira-work
    # The app's own account, users with a permission, user keys in audit records.
    - read:jira-user
    # Group members, audit records, adding role members.
    - manage:jira-configuration
    # Setting and removing role members; Lab mode creates and deletes its project.
    - manage:jira-project
    # Lab mode creates sample work items in its own project.
    - write:jira-work
    # Teamwork Graph engagement evidence (as the signed-in user only).
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:project:jira
    - read:graph:issue:jira
    - read:graph:issue-comment:jira
